version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-linkding_linkding_1
      APP_PORT: 9090
      # linkding has its own login
      PROXY_AUTH_ADD: "false"

  linkding:
    image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    restart: on-failure
    environment:
      # IPv4: some Umbrels have IPv6 switched off, and linkding listens on IPv6 by default
      LD_SERVER_HOST: 0.0.0.0
      LD_SUPERUSER_NAME: umbrel
      LD_SUPERUSER_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/etc/linkding/data
