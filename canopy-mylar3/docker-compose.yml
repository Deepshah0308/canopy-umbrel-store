version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-mylar3_mylar3_1
      APP_PORT: 8090

  mylar3:
    image: linuxserver/mylar3:0.11.0@sha256:1964a63fbb7f95e45923e74cf5174e78c8fda92f567f261e51bf8de535418a15
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/media/comics:/comics
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
