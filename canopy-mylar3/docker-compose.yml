version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-mylar3_mylar3_1
      APP_PORT: 8090

  mylar3:
    image: linuxserver/mylar3:5.9.5@sha256:b4c8c2bdd69ccb3a1842ca427137e43a1878718a7f89974fb2bf912e9ab8494a
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/media/comics:/comics
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
