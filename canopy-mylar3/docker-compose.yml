version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-mylar3_mylar3_1
      APP_PORT: 8090

  mylar3:
    image: linuxserver/mylar3:0.11.0@sha256:135ca140b87ee07e3e780b7d8bc9dbba524e51c5433eabdedff3833b6a44aef1
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/media/comics:/comics
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
