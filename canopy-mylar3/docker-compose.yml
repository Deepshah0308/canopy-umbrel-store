version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-mylar3_mylar3_1
      APP_PORT: 8090

  mylar3:
    image: linuxserver/mylar3:0.11.0@sha256:2f1cfd67e84a20568f58c5661f7ef3475d17adb2f869555f227b3e6547430e4c
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/media/comics:/comics
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
