version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-mylar3_mylar3_1
      APP_PORT: 8090

  mylar3:
    image: linuxserver/mylar3:0.11.0@sha256:b4e9713e6eaea87df9cbbaa48ba280b6570cf84b497ff43db13cc5554f54c320
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/media/comics:/comics
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
