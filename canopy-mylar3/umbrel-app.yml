manifestVersion: 1
id: canopy-mylar3
category: media
name: Mylar3
version: "0.11.1"
tagline: "Comic book automation: follows series and grabs new issues"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/png/mylar.png
description: >-
  Mylar3 does for comics what Sonarr does for TV: follow a series and it watches for new issues, downloads them through your Usenet or torrent client, renames them and files them in your library.


  Your library is in the Files app under Downloads → media → comics, so readers like Kavita or Komga can use the same folder. Add your download client and indexers under Settings.
