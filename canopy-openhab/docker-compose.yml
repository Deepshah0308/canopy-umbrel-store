version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-openhab_openhab_1
      APP_PORT: 8080
      # openHAB has its own logins
      PROXY_AUTH_ADD: "false"

  openhab:
    image: openhab/openhab:5.2.4@sha256:acc7be1047d413656d81ff56547c30c2ee2cdc2a449226dacf416c8ae7533881
    restart: on-failure
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ:-Etc/UTC}
      CRYPTO_POLICY: unlimited
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
    volumes:
      - ${APP_DATA_DIR}/data/conf:/openhab/conf
      - ${APP_DATA_DIR}/data/userdata:/openhab/userdata
      - ${APP_DATA_DIR}/data/addons:/openhab/addons
