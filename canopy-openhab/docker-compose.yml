version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-openhab_openhab_1
      APP_PORT: 8080
      # openHAB has its own logins
      PROXY_AUTH_ADD: "false"

  openhab:
    image: openhab/openhab:5.2.5@sha256:40654321e9af40f20da4d6d6ef8031523b780509d6e1beb2276e365771bc8848
    restart: on-failure
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ:-Etc/UTC}
      CRYPTO_POLICY: unlimited
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
    volumes:
      - ${APP_DATA_DIR}/data/conf:/openhab/conf
      - ${APP_DATA_DIR}/data/userdata:/openhab/userdata
      - ${APP_DATA_DIR}/data/addons:/openhab/addons
