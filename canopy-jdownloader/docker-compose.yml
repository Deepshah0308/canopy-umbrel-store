version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-jdownloader_jdownloader_1
      APP_PORT: 5800

  jdownloader:
    image: jlesage/jdownloader-2:v26.11.2@sha256:deb1f5519e5434d2d22d87f5c91044986b302d2cfb86846d7e72b2ad4def4ea3
    restart: on-failure
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ:-Etc/UTC}
      KEEP_APP_RUNNING: "1"
      DARK_MODE: "1"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/jdownloader:/output
