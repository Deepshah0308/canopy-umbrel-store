version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-jdownloader_jdownloader_1
      APP_PORT: 5800

  jdownloader:
    image: jlesage/jdownloader-2:v26.11.1@sha256:2619aae2d501abfcaba01862882716840068fcc25b4584b656ff0cc16d76f2c0
    restart: on-failure
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ:-Etc/UTC}
      KEEP_APP_RUNNING: "1"
      DARK_MODE: "1"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/jdownloader:/output
