manifestVersion: 1
id: canopy-grist
category: files
name: Grist
version: "1.7.22-1"
tagline: "Spreadsheets that work like a database, an Airtable alternative"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/grist.svg
description: >-
  Grist looks like a spreadsheet but thinks like a database. Columns have types (dates, choices, references to other tables), formulas are written in Python, and the same data can be shown as tables, cards, charts and forms on one page. Use it for budgets, inventories, CRMs, project trackers or anything you'd otherwise keep in Excel or Airtable.


  Import and export Excel and CSV files, share forms that add rows, and keep every document on your Umbrel. Grist opens straight away behind your Umbrel login, with no separate account to create.
developer: Grist Labs
website: https://www.getgrist.com
dependencies: []
repo: https://github.com/gristlabs/grist-core
support: https://github.com/Deepshah0308/canopy-umbrel-store/issues
port: 7416
gallery:
  - https://canopystore.app/gallery/canopy-grist/1.webp
  - https://canopystore.app/gallery/canopy-grist/2.webp
  - https://canopystore.app/gallery/canopy-grist/3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Grist no longer gets stuck starting when its formula sandbox check hangs (seen on arm64): the check now gives up after 30 seconds and Grist runs formulas without the sandbox. Also adds screenshots to the App Store page.
submitter: Deepshah0308
