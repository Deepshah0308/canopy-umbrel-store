version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-grist_grist_1
      APP_PORT: 8484
      # Grist has no login of its own here, so it stays behind your Umbrel login

  grist:
    image: gristlabs/grist:1.7.22@sha256:c2221950675081c79a06a44c27f8c65cc96c43d93d76f2b3214d8dbdff709355
    restart: on-failure
    # run formulas inside gVisor when this machine's kernel allows it; otherwise start anyway without it
    command:
      - bash
      - -c
      - source ./sandbox/gvisor/get_checkpoint_path.sh; if runsc --network none $$GVISOR_FLAGS do true 2>/dev/null; then export GRIST_SANDBOX_FLAVOR=gvisor; else echo "gVisor isn't available here, so formulas run without a sandbox"; fi; exec ./sandbox/run.sh
    environment:
      GRIST_SESSION_SECRET: ${APP_SEED}
      # one person behind the Umbrel login: sign them in as the admin and skip the first-run boot key step
      GRIST_DEFAULT_EMAIL: umbrel@localhost
      GRIST_ADMIN_EMAIL: umbrel@localhost
      GRIST_IN_SERVICE: "true"
      GRIST_FORCE_LOGIN: "true"
      GRIST_TELEMETRY_LEVEL: "off"
      GRIST_ALLOW_AUTOMATIC_VERSION_CHECKING: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/persist
