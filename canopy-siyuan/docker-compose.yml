version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-siyuan_siyuan_1
      APP_PORT: 6806
      # SiYuan asks for its own access code
      PROXY_AUTH_ADD: "false"

  siyuan:
    image: b3log/siyuan:v3.8.9@sha256:4f9c119048b9dc685603b04aebf9e9d513695014c9fbd834e0dadd1c22801235
    restart: on-failure
    command: ["serve", "--workspace=/siyuan/workspace/", "--accessAuthCode=${APP_PASSWORD}"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/siyuan/workspace
