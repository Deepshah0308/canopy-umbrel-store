version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-siyuan_siyuan_1
      APP_PORT: 6806
      # SiYuan asks for its own access code
      PROXY_AUTH_ADD: "false"

  siyuan:
    image: b3log/siyuan:v3.8.10@sha256:44ee53c45cde3a252c6d913de9b0ff79bf9bb0a5e336e5cc36c06357d6757919
    restart: on-failure
    command: ["serve", "--workspace=/siyuan/workspace/", "--accessAuthCode=${APP_PASSWORD}"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/siyuan/workspace
