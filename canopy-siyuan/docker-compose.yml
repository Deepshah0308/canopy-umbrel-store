version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-siyuan_siyuan_1
      APP_PORT: 6806
      # SiYuan asks for its own access code
      PROXY_AUTH_ADD: "false"

  siyuan:
    image: b3log/siyuan:v3.8.11@sha256:4166c882818eea4aafb5e7c42f2e8568184b611d20953eff10e2cb6f08fe9c65
    restart: on-failure
    command: ["serve", "--workspace=/siyuan/workspace/", "--accessAuthCode=${APP_PASSWORD}"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/siyuan/workspace
