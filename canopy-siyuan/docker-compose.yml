version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-siyuan_siyuan_1
      APP_PORT: 6806
      # SiYuan asks for its own access code
      PROXY_AUTH_ADD: "false"

  siyuan:
    image: b3log/siyuan:v3.8.12@sha256:3e1b65ce633e437fed4ed440367d0dc316039b02d4554a47bdda16790b6a973d
    restart: on-failure
    command: ["serve", "--workspace=/siyuan/workspace/", "--accessAuthCode=${APP_PASSWORD}"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${APP_DATA_DIR}/data/workspace:/siyuan/workspace
