version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-bytestash_bytestash_1
      APP_PORT: 5000
      # ByteStash has its own accounts
      PROXY_AUTH_ADD: "false"

  bytestash:
    image: ghcr.io/jordan-dalby/bytestash:1.6.1@sha256:2c79156850340eeff4e76bbb81e3aab78b42e40509cf2af0acdb18682e579cf1
    restart: on-failure
    environment:
      BASE_PATH: ""
      JWT_SECRET: ${APP_SEED}
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
      DISABLE_ACCOUNTS: "false"
      DISABLE_INTERNAL_ACCOUNTS: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data/snippets
