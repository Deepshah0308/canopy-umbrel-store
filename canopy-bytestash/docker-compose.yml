version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-bytestash_bytestash_1
      APP_PORT: 5000
      # ByteStash has its own accounts
      PROXY_AUTH_ADD: "false"

  bytestash:
    image: ghcr.io/jordan-dalby/bytestash:1.6.2@sha256:86d5726ef9a417775cc05120eed04c36915cbc41aea83c5799fc6b8d3ad77db5
    restart: on-failure
    environment:
      BASE_PATH: ""
      JWT_SECRET: ${APP_SEED}
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
      DISABLE_ACCOUNTS: "false"
      DISABLE_INTERNAL_ACCOUNTS: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data/snippets
