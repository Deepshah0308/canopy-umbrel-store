name: Something isn't working
description: Report a problem with an app from Canopy
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For YAMS, try **Quick fixes → Fix everything** on its dashboard first. It solves most connection problems.
  - type: input
    id: version
    attributes:
      label: App and version
      description: Shown on the app's page in the Umbrel App Store (and at the top of the YAMS dashboard).
      placeholder: YAMS 1.4.0
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which part is affected?
      options:
        - Installing an app
        - Another Canopy app (Netdata, Miniflux, …)
        - YAMS extras (Seerr, Lidarr, Recyclarr, Unpackerr, Decluttarr)
        - VPN (gluetun)
        - qBittorrent
        - Sonarr
        - Radarr
        - Prowlarr
        - Jellyfin
        - Bazarr
        - YAMS dashboard (setup, fixes, updates, backups)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In the YAMS dashboard, click **Logs** on the affected app, then **Copy**, and paste here. Remove anything private first. Never paste your VPN file or passwords.
      render: text
  - type: input
    id: hardware
    attributes:
      label: Umbrel hardware and umbrelOS version
      placeholder: Umbrel Home, umbrelOS 1.5
