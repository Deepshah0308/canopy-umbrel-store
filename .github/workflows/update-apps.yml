name: Update apps

# Every day: find newer releases of every app, test each update by installing it, and
# ship it. Major versions and anything that fails the test become pull requests instead.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these app ids (space separated, blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Log in to Docker Hub (optional, for higher pull limits)
        if: env.HAS_DOCKERHUB == 'true'
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Update, test and ship
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "canopy-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          only="${{ github.event.inputs.only }}"
          if [ -n "$only" ]; then
            sudo -E env "PATH=$PATH" python tools/ship_updates.py --only $only
          else
            sudo -E env "PATH=$PATH" python tools/ship_updates.py
          fi
