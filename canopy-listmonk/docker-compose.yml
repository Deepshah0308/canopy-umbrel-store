version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-listmonk_listmonk_1
      APP_PORT: 9000
      # Listmonk has its own login
      PROXY_AUTH_ADD: "false"

  listmonk:
    image: listmonk/listmonk:v6.2.0@sha256:f535d59e14991337a9f2d570273685378ae86b0d7698c3e00da444e3bc205286
    restart: on-failure
    # set up the database on first start, apply upgrades after updates, then run
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: canopy-listmonk_db_1
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${APP_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: umbrel
      LISTMONK_ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/listmonk/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: on-failure
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: listmonk
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "listmonk"]
      interval: 10s
      start_period: 30s
