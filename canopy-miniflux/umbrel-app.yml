manifestVersion: 1
id: canopy-miniflux
category: social
name: Miniflux
version: "2.3.5"
tagline: "Minimalist, fast RSS reader with no clutter"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/miniflux.svg
description: >-
  Miniflux is a reader for RSS and Atom feeds that does one thing well: shows you new articles from the sites you follow, quickly, without ads or tracking. It fetches full articles, removes trackers from links, supports keyboard shortcuts and works with mobile apps through the Fever and Google Reader APIs.


  Sign in with the username and password shown on this page.
developer: Frédéric Guillot
website: https://miniflux.app
