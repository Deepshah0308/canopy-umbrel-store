version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: canopy-miniflux_miniflux_1
      APP_PORT: 8080
      # Miniflux has its own login
      PROXY_AUTH_ADD: "false"

  miniflux:
    image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
    restart: on-failure
    environment:
      DATABASE_URL: postgres://miniflux:${APP_PASSWORD}@canopy-miniflux_db_1/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: umbrel
      ADMIN_PASSWORD: ${APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: on-failure
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: miniflux
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
