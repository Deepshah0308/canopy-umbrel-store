manifestVersion: 1.1
id: canopy-yams
category: media
name: YAMS
version: "1.4.0"
tagline: "Your own Netflix — movies, shows and subtitles, fully automatic"
icon: https://cdn.jsdelivr.net/gh/Deepshah0308/canopy-umbrel-store@24f69a96df050bcb6c34e3a7be0c65303b4f1112/canopy-yams/icon.svg
description: >-
  YAMS (Yet Another Media Server) packaged for umbrelOS as a single app. One install gives you
  a complete, pre-wired media server:


  🎬 Jellyfin — watch on your TV, phone, browser or console

  📺 Sonarr — follows your TV shows and grabs new episodes

  🍿 Radarr — finds and organises movies

  🔍 Prowlarr + FlareSolverr — one place to manage where YAMS searches

  💬 Bazarr — automatic subtitles

  📥 qBittorrent — downloads, locked behind a VPN (gluetun) so nothing leaks if the VPN drops


  ➕ EXTRAS, ONE SWITCH EACH

  Seerr (requests for the whole family), Lidarr (music), Recyclarr (TRaSH Guides quality settings),
  Unpackerr (unpacks .rar downloads) and Decluttarr (clears stuck downloads). Switch one on in the
  dashboard and YAMS connects it to everything else; switched off, it uses no memory.


  ✨ WHAT'S ALREADY DONE FOR YOU

  Every app is connected to every other app. Folders are laid out so files are hardlinked instead
  of copied (no wasted disk space). Jellyfin is set up with Movies and Shows libraries. Sonarr and
  Radarr already know about qBittorrent and Prowlarr. Everything sits behind your Umbrel login.


  🛠️ AFTER INSTALLING

  Open YAMS and follow the four steps on the dashboard: paste your VPN's WireGuard file, pick your
  indexers in Prowlarr, add a show or movie, then start watching in Jellyfin (port 8097).


  🧰 ONE PLACE TO MANAGE IT ALL

  The YAMS dashboard shows every app's status, lets you read logs and restart any app, runs a
  VPN leak check, updates every app to its newest version with one click (or weekly), backs up
  and restores all your settings, and has one-click fixes for the most common problems. Home-screen widgets show VPN status, active
  downloads and your library at a glance.


  Your library lives in the Files app under Downloads → media.
developer: rogs (YAMS) · packaged for Umbrel by the community
website: https://yams.media
dependencies: []
repo: https://github.com/rogsme/yams
support: https://github.com/Deepshah0308/canopy-umbrel-store/issues
port: 8746
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  YAMS now lives in the Canopy app store. New: Extras you can switch on from the dashboard
  and YAMS connects for you: Seerr (a request page for your family), Lidarr (music, with a Music
  library in Jellyfin), Recyclarr (TRaSH Guides quality settings), Unpackerr (unpacks .rar
  downloads) and Decluttarr (clears stuck downloads). Fixed: Sonarr and Radarr now get
  qBittorrent set up even before your VPN is connected. Moving from the old YAMS store? Back up
  in the old YAMS, uninstall it (backups in Downloads stay), install this one and restore.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "dashboard:8000/widgets/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "VPN"
          text: "On"
          subtext: "Canada"
        - title: "Downloading"
          text: "2"
          subtext: "4.1 MB/s"
        - title: "Shows"
          text: "12"
          subtext: "followed"
        - title: "Movies"
          text: "48"
          subtext: "in library"
  - id: "downloads"
    type: "list"
    refresh: "5s"
    endpoint: "dashboard:8000/widgets/downloads"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "42% • Some.Show.S01E03.1080p"
          subtext: "↓ 3.1 MB/s • 12 min left"
        - text: "7% • Some.Movie.2024.1080p"
          subtext: "↓ 1.0 MB/s • 48 min left"
submitter: Deepshah0308
submission: https://github.com/Deepshah0308/canopy-umbrel-store
